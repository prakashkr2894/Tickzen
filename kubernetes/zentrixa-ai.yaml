apiVersion: apps/v1
kind: Deployment
metadata:
  name: zentrixa-ai
  namespace: tickzen
  labels:
    app: zentrixa-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zentrixa-ai
  template:
    metadata:
      labels:
        app: zentrixa-ai
    spec:
      containers:
      - name: zentrixa-ai
        image: prakash1142/zentrixa-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
        env:
        - name: WHISPER_MODEL
          value: "base"
        - name: WHISPER_COMPUTE_TYPE
          value: "int8"
        - name: INTENT_CONFIDENCE_THRESHOLD
          value: "0.90"
        resources:
          requests:
            cpu: 200m
            memory: 800Mi
          limits:
            cpu: 1000m
            memory: 1500Mi
        # Startup probe — generous window: model loads synchronously at start
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          failureThreshold: 36    # 36 × 5s = 3 min startup budget
          periodSeconds: 5
        # Liveness — confirm process is alive (instant endpoint)
        livenessProbe:
          httpGet:
            path: /live
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3
        # Readiness — only ready once Whisper + IntentEngine are loaded
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: zentrixa-ai-service
  namespace: tickzen
spec:
  selector:
    app: zentrixa-ai
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
  type: ClusterIP
