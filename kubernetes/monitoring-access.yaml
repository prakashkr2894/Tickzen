apiVersion: v1
kind: ServiceAccount
metadata:
  name: tickzen-monitor
  namespace: tickzen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tickzen-monitor-role
  namespace: tickzen
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tickzen-monitor-binding
  namespace: tickzen
subjects:
- kind: ServiceAccount
  name: tickzen-monitor
  namespace: tickzen
roleRef:
  kind: Role
  name: tickzen-monitor-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: tickzen-monitor-token
  namespace: tickzen
  annotations:
    kubernetes.io/service-account.name: tickzen-monitor
type: kubernetes.io/service-account-token
