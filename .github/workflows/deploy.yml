name: CI-CD Pipeline (Docker Compose Deployment)

on:
  push:
    branches:
      - main

jobs:
  # ── Build & Push backend image ─────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mean-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/mean-backend:${{ github.sha }}

  # ── Build & Push frontend image ────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_API_BASE_URL=/api
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mean-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/mean-frontend:${{ github.sha }}


  # ── Build & Push zentrixa-ai image ─────────────────────────────────────────
  build-zentrixa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Zentrixa AI
        uses: docker/build-push-action@v4
        with:
          context: ./zentrixa-ai
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:latest
            ${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:${{ github.sha }}

  # ── Deploy to VPS using Docker Compose ─────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-zentrixa]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/tickzen/"

      - name: Deploy Docker Compose stack on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "Navigating to ~/tickzen directory..."
            mkdir -p ~/tickzen
            cd ~/tickzen

            echo "Updating .env file with secrets..."
            cat << 'EOF' > .env
            PORT=5000
            MONGODB_URI=${{ secrets.MONGODB_URI }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE=${{ secrets.JWT_EXPIRE }}
            BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
            BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}
            BREVO_SENDER_NAME=${{ secrets.BREVO_SENDER_NAME }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            RAZORPAY_KEY_ID=${{ secrets.RAZORPAY_KEY_ID }}
            RAZORPAY_KEY_SECRET=${{ secrets.RAZORPAY_KEY_SECRET }}
            EOF

            echo "Pulling latest Docker images..."
            docker compose pull

            echo "Restarting Docker containers..."
            docker compose up -d --remove-orphans

            echo "Cleaning up old unused Docker images..."
            docker image prune -f

            echo "Deployment completed successfully! 🚀"