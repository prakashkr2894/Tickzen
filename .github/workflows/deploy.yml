name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ── Build backend image ──────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Export Backend
        run: |
          docker buildx build \
            --cache-from type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mean-backend:cache \
            --cache-to   type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mean-backend:cache,mode=max \
            --tag ${{ secrets.DOCKER_USERNAME }}/mean-backend:${{ github.sha }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/mean-backend:latest \
            --load \
            ./backend
          docker save -o backend.tar ${{ secrets.DOCKER_USERNAME }}/mean-backend:${{ github.sha }}

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar
          retention-days: 1

  # ── Build frontend image ────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Export Frontend
        run: |
          docker buildx build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --cache-from type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mean-frontend:cache \
            --cache-to   type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mean-frontend:cache,mode=max \
            --tag ${{ secrets.DOCKER_USERNAME }}/mean-frontend:${{ github.sha }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/mean-frontend:latest \
            --load \
            ./frontend
          docker save -o frontend.tar ${{ secrets.DOCKER_USERNAME }}/mean-frontend:${{ github.sha }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend.tar
          retention-days: 1

  # ── Build zentrixa-ai image ─────────────────────────────────────────────────
  build-zentrixa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Export Zentrixa AI
        run: |
          docker buildx build \
            --cache-from type=registry,ref=${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:cache \
            --cache-to   type=registry,ref=${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:cache,mode=max \
            --tag ${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:${{ github.sha }} \
            --tag ${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:latest \
            --load \
            ./zentrixa-ai
          docker save -o zentrixa-ai.tar ${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:${{ github.sha }}

      - name: Upload zentrixa artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentrixa-image
          path: zentrixa-ai.tar
          retention-days: 1

  # ── Deploy to VPS (after all 3 builds succeed in parallel) ─────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, build-zentrixa]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Copy artifacts to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend.tar,frontend.tar,zentrixa-ai.tar,kubernetes/*.yaml"
          target: "/tmp/tickzen-deploy"

      - name: Deploy to k3s on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # ---------- IMPORT IMAGES TO CONTAINERD ----------
            echo "Importing images into containerd..."
            sudo k3s ctr -n k8s.io images import /tmp/tickzen-deploy/backend.tar
            sudo k3s ctr -n k8s.io images import /tmp/tickzen-deploy/frontend.tar
            sudo k3s ctr -n k8s.io images import /tmp/tickzen-deploy/zentrixa-ai.tar

            # ---------- SECRETS CONFIGURATION ----------
            echo "Applying secret configuration..."
            sudo kubectl create secret generic tickzen-secrets \
              --namespace=tickzen \
              --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              --from-literal=JWT_EXPIRE="${{ secrets.JWT_EXPIRE }}" \
              --from-literal=BREVO_API_KEY="${{ secrets.BREVO_API_KEY }}" \
              --from-literal=BREVO_SENDER_EMAIL="${{ secrets.BREVO_SENDER_EMAIL }}" \
              --from-literal=BREVO_SENDER_NAME="${{ secrets.BREVO_SENDER_NAME }}" \
              --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              --from-literal=RAZORPAY_KEY_ID="${{ secrets.RAZORPAY_KEY_ID }}" \
              --from-literal=RAZORPAY_KEY_SECRET="${{ secrets.RAZORPAY_KEY_SECRET }}" \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            # ---------- PREPARE MANIFESTS ----------
            echo "Updating image tags in Kubernetes manifests..."
            cd /tmp/tickzen-deploy/kubernetes
            sed -i "s|image: prakash1142/mean-backend:latest|image: ${{ secrets.DOCKER_USERNAME }}/mean-backend:${{ github.sha }}|g" backend.yaml
            sed -i "s|image: prakash1142/mean-frontend:latest|image: ${{ secrets.DOCKER_USERNAME }}/mean-frontend:${{ github.sha }}|g" frontend.yaml
            sed -i "s|image: prakash1142/zentrixa-ai:latest|image: ${{ secrets.DOCKER_USERNAME }}/zentrixa-ai:${{ github.sha }}|g" zentrixa-ai.yaml

            # ---------- APPLY MANIFESTS ----------
            echo "Applying Kubernetes manifests..."
            sudo kubectl apply -f namespace.yaml
            sudo kubectl apply -f backend.yaml
            sudo kubectl apply -f frontend.yaml
            sudo kubectl apply -f zentrixa-ai.yaml
            sudo kubectl apply -f ingress.yaml
            sudo kubectl apply -f monitoring-access.yaml

            # ---------- DEPLOYMENT VERIFICATION ----------
            echo "Waiting for rollouts to complete..."
            sudo kubectl rollout status deployment/tickzen-backend  -n tickzen --timeout=120s
            sudo kubectl rollout status deployment/tickzen-frontend -n tickzen --timeout=120s
            sudo kubectl rollout status deployment/zentrixa-ai      -n tickzen --timeout=120s

            echo "Verifying Pods readiness status..."
            sudo kubectl wait --for=condition=Ready pod -l app=tickzen-backend  -n tickzen --timeout=120s
            sudo kubectl wait --for=condition=Ready pod -l app=tickzen-frontend -n tickzen --timeout=120s
            sudo kubectl wait --for=condition=Ready pod -l app=zentrixa-ai      -n tickzen --timeout=120s

            echo "Validating application health endpoints..."
            BACKEND_HEALTH_STATUS=$(sudo kubectl exec -n tickzen deployment/tickzen-backend -c backend -- curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
            if [ "$BACKEND_HEALTH_STATUS" -ne 200 ]; then
              echo "Backend healthcheck failed: Status $BACKEND_HEALTH_STATUS"
              exit 1
            fi
            echo "Backend is healthy! ✅"

            FRONTEND_STATUS=$(sudo kubectl exec -n tickzen deployment/tickzen-frontend -c frontend -- curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
            if [ "$FRONTEND_STATUS" -ne 200 ]; then
              echo "Frontend healthcheck failed: Status $FRONTEND_STATUS"
              exit 1
            fi
            echo "Frontend is healthy! ✅"

            # ---------- CLEANUP STORAGE ----------
            echo "Starting post-deployment storage optimization..."

            # Remove temporary deploy archives
            rm -rf /tmp/tickzen-deploy

            # Containerd cleanup: remove dangling/untagged images replaced by new imports
            if command -v k3s &>/dev/null; then
              DANGLING_IMAGES=$(sudo k3s crictl images | awk '$2 == "<none>" {print $3}')
              if [ ! -z "$DANGLING_IMAGES" ]; then
                echo "Removing dangling containerd images: $DANGLING_IMAGES"
                sudo k3s crictl rmi $DANGLING_IMAGES || true
              fi
            fi

            # Conditional Docker cleanup (only if Docker daemon is active on VPS)
            if command -v docker &>/dev/null && systemctl is-active --quiet docker; then
              echo "Pruning Docker images and builder cache on VPS..."
              docker image prune -f || true
              docker builder prune -f || true
            fi

            echo "Deployment fully validated and cleanup completed successfully! 🎉"